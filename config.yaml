# =============================================================
# preditivo_trade — configuração central
# Tudo que é parâmetro de decisão vive aqui, nunca no código.
# O trader normalmente só precisa mexer em `prediction.horizon_bars`.
# =============================================================

# Janela futura do insight, em barras de 2 minutos:
#   1 = próximos 2 min | 2 = próximos 4 min | 3 = próximos 6 min ...
# Cada horizonte tem seu próprio modelo treinado (prever 2 min e 6 min
# são tarefas diferentes). Ao mudar, o app aprende de novo sozinho.
prediction:
  horizon_bars: 1

mt5:
  # Deixe vazio para usar o terminal MT5 já aberto e logado na máquina.
  # Se houver mais de um MT5 instalado, aponte para o terminal64.exe.
  terminal_path: ""
  login: 0          # 0 = conta já logada no terminal
  password: ""
  server: ""

# OPCIONAL: ao vivo, o programa detecta sozinho os gráficos abertos no
# MT5 — não precisa listar nada aqui. Esta lista serve para os scripts
# (download_history/train/replay) e para mapear apelido -> símbolo da
# corretora quando quiser usar nomes lógicos.
symbols:
  NVDA:  { mt5_symbol: "NVDA" }
  AMD:   { mt5_symbol: "AMD" }
  MSFT:  { mt5_symbol: "MSFT" }
  GOOGL: { mt5_symbol: "GOOGL" }
  OURO:  { mt5_symbol: "XAUUSD" }
  BTC:   { mt5_symbol: "BTCUSD" }
  HK50:  { mt5_symbol: "HK50" }

bars:
  timeframe_minutes: 2     # barra de 2 minutos (M2 nativo do MT5)
  poll_seconds: 1.0        # frequência de checagem por barra fechada
  chart_scan_seconds: 5    # frequência de detecção de gráficos abertos/fechados
  history_bars: 3000       # barras carregadas na partida (visão macro)

labeling:
  # quantile: theta adaptativo por ativo E por horizonte = quantil dos
  #           |retornos| passados, mantém as 3 classes (ALTA/BAIXA/
  #           LATERAL) balanceadas em qualquer regime de volatilidade.
  # fixed:    theta fixo em % (fixed_theta_pct).
  mode: quantile
  lateral_quantile: 0.33   # ~1/3 das barras viram LATERAL
  window: 500              # janela dos retornos passados p/ o quantil
  fixed_theta_pct: 0.0005  # usado apenas se mode: fixed

features:
  micro_windows: [3, 5, 10]      # visão micro: o momento
  macro_windows: [30, 60, 120]   # visão macro: o contexto do dia

signals:
  buy_prob: 0.60     # P(ALTA) mínima para sugerir compra
  margin: 0.25       # vantagem mínima P(ALTA) - P(BAIXA) (simétrico p/ venda)
  exit_prob: 0.55    # prob. contrária que sugere saída da posição

# Simulador de operações (paper trading) exibido na janelinha. NÃO envia
# ordens — só mede o desempenho do modelo em dólares. Os limiares de
# entrada são MAIS altos que os de `signals` (seletividade): tradar menos
# e melhor é a única forma honesta de perseguir a meta de winrate.
simulation:
  enabled: true
  entry_prob: 0.62          # confiança mínima p/ ENTRAR uma operação simulada
  entry_margin: 0.30        # vantagem mínima da direção vencedora sobre a oposta
  partial_exit_prob: 0.45   # pressão contrária MODERADA -> vende um pedaço (parcial)
  partial_fraction: 0.5     # fração do que resta vendida em cada saída parcial
  exit_prob: 0.55           # pressão contrária FORTE -> zera o restante
  min_hold_seconds: 40      # regra: não entrar e sair em menos de 40s
  window_seconds: 600       # janela de 10 min: até 2 entradas e 2 saídas nela
  max_entries_per_window: 2
  max_exits_per_window: 2   # cada pedaço vendido conta como uma saída
  max_hold_minutes: 10      # tempo máximo segurando a posição (5 barras de 2 min)
  size_min_usd: 2000        # capital mínimo por operação
  size_max_usd: 4000        # capital máximo por operação
  cost_pct: 0.0             # custo por operação (spread+corretagem) em fração; 0 = só direção
  goal_trades: 20           # meta avaliada ao atingir este nº de operações
  goal_winrate: 0.68        # winrate-alvo (68%)

model:
  dir: models
  auto_train: true       # aprende sozinho ao ver um ativo novo (em 2º plano)
  train_bars: 20000      # barras baixadas p/ o treino automático (~28 pregões)
  min_train_bars: 2000   # não treina com menos que isso
  calib_fraction: 0.2    # fatia final do treino reservada p/ calibração

ui:
  mode: overlay      # overlay (janelinha) | console (terminal)
  always_on_top: true
  font_size: 9

storage:
  data_dir: data
